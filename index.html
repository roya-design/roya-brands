        body{
  --bg-color: #fff;
  --text-color: #18191a;
  --switch-shadow: 0px 0px 10px 3px rgba(0, 0, 0, 0.1) inset;
  --transition: all 0.3s cubic-bezier(0.76, 0, 0.24, 1);
}

.dark body {
  --bg-color: #18191a;
  --text-color: #e4e6eb;
  --switch-shadow: 0px 0px 10px 3px rgba(0, 0, 0, 0.5) inset;
}

@media (prefers-color-scheme: dark) {
  body {
    --bg-color: #18191a;
    --text-color: #e4e6eb;
    --switch-shadow: 0px 0px 10px 3px rgba(0, 0, 0, 0.5) inset;
  }
  .light body {
    --bg-color: #fff;
    --text-color: #18191a;
    --switch-shadow: 0px 0px 10px 3px rgba(0, 0, 0, 0.1) inset;
  }
}

body {

  background: var(--bg-color);
  transition: var(--transition);
}
html:not(.light) .brand-box-container ul .brand-form p,
html:not(.light) .brand-box-container .brand-letter-group .headline-letter {
    color: #fff;

html:not(.light) .brand-box-container ul .brand-form .copy-clip svg {

html:not(.light) .brands .filter-group .button-wrapper a:hover,
html:not(.light) .brands .filter-group .button-wrapper a.active {
    background: #808080;
}
.theme-switch {
  display: flex;
  justify-content: center;
  align-items: center;
}

.theme-switch .checkbox {
  opacity: 0;
  position: absolute;
}

.theme-switch .label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
  border-radius: 50px;
  position: relative;
  height: 40px;
  width: 80px;
  cursor: pointer;
  box-shadow: var(--switch-shadow);
  transition: var(--transition);
}

.theme-switch .label:hover .moon,
.theme-switch .label:hover .sun {
  transform: rotate(360deg);
}

.theme-switch .ball {
  transition: var(--transition);
  background-color: var(--text-color);
  position: absolute;
  border-radius: 50%;
  top: 5px;
  left: 5px;
  height: 30px;
  width: 30px;
 }

.theme-switch .moon {
  color: #f1c40f;
  transform-origin: center center;
  transition: all 0.5s cubic-bezier(0.76, 0, 0.24, 1);
  transform: rotate(0);
}

.theme-switch .sun {
  color: #ff6b00;
  transform-origin: center center;
  transition: all 0.5s cubic-bezier(0.76, 0, 0.24, 1);
  transform: rotate(0);
}

.theme-switch .ball {
  transform: translatex(0);
}

.dark .theme-switch .ball {
  transform: translatex(40px);
}

.theme-switch {
    position: fixed;
    z-index: 9999999;
    top: 50%;
    right: -1%;
    transform: rotate(-90deg) translate(0, -50%);
}

                        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%;"></div>
                      </div>
                      <p class="hide" id="result"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/js/common.js?jxl1898761698=jxl1898761698"></script>
    <!-- Script Injections -->
    <script src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/scripts/dependencies.js"></script>
    <script src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/scripts/jszip.js"></script>
    <script src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/scripts/jszip-utils.js"></script>
    <script src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/scripts/filesaver.js"></script>

    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.js"></script>
    <script src="https://admin.roya.com/sites/Site-b0ac8594-8528-44a1-b5eb-8d504e44dacb/scripts/lazyimages.js"></script>
    
    <script>
  // --- 1. Clipboard Copy Handling ---
  $(function () {
    $(document).on('click', '.copy-clip', function (e) {
      e.stopPropagation();
      const $toast = $(this).find('.copied-toast');
      const textToCopy = $(this).data('link') || $(this).find('.text-copy').text();

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          $toast.text("Copied!").stop(true, true).fadeIn(150).delay(1200).fadeOut(300, function() {
            $toast.text("Copy Image Url");
          });
        }).catch(() => {
          fallbackCopyText(textToCopy, $toast);
        });
      } else {
        fallbackCopyText(textToCopy, $toast);
      }
    });

    function fallbackCopyText(text, $toast) {
      const tempInput = document.createElement("input");
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);
      $toast.text("Copied!").stop(true, true).fadeIn(150).delay(1200).fadeOut(300, function() {
        $toast.text("Copy Image Url");
      });
    }

    $(document).on('mouseenter', '.copy-clip', function() {
      $(this).parents('.each-brand').find('.brand-image-hover').addClass('svg_active');
    }).on('mouseleave', '.copy-clip', function() {
      $(this).parents('.each-brand').find('.brand-image-hover').removeClass('svg_active');
    });
  });

  // --- 2. Dropbox API & File Ingestion ---
  const CLIENT_ID = _0x227282(0x209) + _0x227282(0x233);
  const CLIENT_SECRET = _0x227282(0x253) + _0x227282(0x22c);
  const REFRESH_TOKEN = _0x227282(0x222) + _0x227282(0x231) + _0x227282(0x1e2) + _0x227282(0x210) + _0x227282(0x23f) + _0x227282(0x1cb) + _0x227282(0x21d);
  const TOKEN_STORAGE_KEY = 'dropbox_auth_token_key';

  async function getAccessToken() {
    const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
    if (storedToken) return storedToken;

    const url = 'https://api.dropbox.com/oauth2/token';
    const params = new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: REFRESH_TOKEN,
      client_id: CLIENT_ID,
      client_secret: CLIENT_SECRET
    });

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
      if (!response.ok) throw new Error('Token refresh failed');
      const data = await response.json();
      localStorage.setItem(TOKEN_STORAGE_KEY, data.access_token);
      return data.access_token;
    } catch (error) {
      console.error('Error refreshing token:', error);
      return null;
    }
  }

  const delay = (ms) => new Promise(res => setTimeout(res, ms));

  async function fetchFilesWithPagination(folderPath) {
    let hasMore = true;
    let cursor = null;
    let allFiles = [];

    const token = await getAccessToken();
    if (!token) return allFiles;

    while (hasMore) {
      try {
        const response = await fetch(`https://api.dropboxapi.com/2/files/list_folder${cursor ? '/continue' : ''}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(cursor ? { cursor } : { path: folderPath, limit: 200 })
        });

        if (response.status === 401) {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          return fetchFilesWithPagination(folderPath);
        }
        if (!response.ok) throw new Error(`Dropbox error: ${response.statusText}`);

        const data = await response.json();
        allFiles.push(...data.entries);
        hasMore = data.has_more;
        cursor = data.cursor;
        await delay(60);
      } catch (err) {
        console.error('Error during paginated fetch:', err);
        break;
      }
    }
    return allFiles;
  }

  async function fetchTempLinkWithRetry(file, retries = 3) {
    const token = await getAccessToken();
    for (let attempt = 0; attempt < retries; attempt++) {
      try {
        const res = await fetch('https://api.dropboxapi.com/2/files/get_temporary_link', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ path: file.path_display })
        });

        if (res.status === 429) {
          const retrySec = parseInt(res.headers.get('Retry-After')) || 1;
          await delay((retrySec * 1000) + 200);
          continue;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        return { ...file, url: data.link };
      } catch (err) {
        if (attempt === retries - 1) return null;
        await delay(400 * Math.pow(2, attempt));
      }
    }
    return null;
  }

  async function fetchTemporaryLinks(files, batchSize = 20) {
    let results = [];
    for (let i = 0; i < files.length; i += batchSize) {
      const batch = files.slice(i, i + batchSize);
      const links = await Promise.all(batch.map(file => fetchTempLinkWithRetry(file)));
      results.push(...links.filter(Boolean));
    }
    return results;
  }

  function renderFiles(filesWithUrls, targetDiv) {
    const fragment = document.createDocumentFragment();
    filesWithUrls.forEach(file => {
      const div = document.createElement('div');
      div.className = 'each-brand';
      div.innerHTML = `
        <div class="brand-image-hover">
          <img class="lazyload" src="${file.url}" data-img="${file.url}" alt="${file.name}">
        </div>
        <div class="brand-form">
          <input type="checkbox" name="brand" value="${file.name}" data-url="${file.url}">
          <input type="hidden" class="data-storage" value="${file.url}" data-name="${file.name}">
          <p class="name">${file.name}</p>
          <div class="copy-clip" data-link="${file.url}">
            <div class="copied-toast">Copy Image Url</div>
            <span class="text-copy" style="display:none;">${file.url}</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-link-45deg" viewBox="0 0 16 16">
              <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
              <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
            </svg>
          </div>
        </div>`;
      fragment.appendChild(div);
    });
    targetDiv.innerHTML = '';
    targetDiv.appendChild(fragment);
  }

  async function loadAllImages() {
    try {
      const folders = await fetchFilesWithPagination('/_Raw Logo');
      const imageFolders = folders.filter(e => e['.tag'] === 'folder');
      const progressBar = document.getElementById('loadingProgress');
      const progressText = document.getElementById('progressText');
      const loadWidth = document.getElementById('loadingwidth');
      let completed = 0;

      await Promise.all(imageFolders.map(async (folder) => {
        const targetDiv = document.querySelector(`div[data-folder="${folder.name}"]`);
        if (!targetDiv) return;

        const files = await fetchFilesWithPagination(folder.path_display);
        const images = files.filter(f => f['.tag'] === 'file' && f.name.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i));
        const withUrls = await fetchTemporaryLinks(images);
        renderFiles(withUrls, targetDiv);

        completed++;
        const pct = Math.round((completed / imageFolders.length) * 100);
        if (progressBar) progressBar.value = pct;
        if (progressText) progressText.textContent = `${pct}%`;
        if (loadWidth) loadWidth.style.width = `${pct}%`;
      }));

      organizeAlphabeticalGroups();
    } catch (err) {
      console.error('Image initialisation error:', err);
    }
  }

  // --- 3. Alphabetical Grouping & DOM Structure ---
  function organizeAlphabeticalGroups() {
    const cleanName = (text) => {
      const sanitized = text.replace(/^\d+[-_]?/, '').trim();
      return sanitized.charAt(0).toUpperCase() + sanitized.slice(1);
    };

    document.querySelectorAll('.brand-box-container').forEach(container => {
      const brands = Array.from(container.querySelectorAll('.each-brand'));
      brands.forEach(brandEl => {
        const p = brandEl.querySelector('p.name');
        const chk = brandEl.querySelector('input[type="checkbox"]');
        const formatted = cleanName(p.textContent);
        p.textContent = formatted;
        chk.value = formatted;

        const letter = formatted.charAt(0).toUpperCase();
        let group = container.querySelector(`.brand-letter-group[data-letter="${letter}"]`);
        if (!group) {
          group = document.createElement('div');
          group.className = 'brand-letter-group';
          group.dataset.letter = letter;
          group.dataset.count = 0;
          group.innerHTML = `<span class="headline-letter">${letter}</span><ul class="list" data-letter="${letter}"></ul>`;
          container.appendChild(group);
        }

        const li = document.createElement('li');
        li.appendChild(brandEl);
        group.querySelector('ul.list').appendChild(li);
      });

      // Sort groups alphabetically in DOM
      const groups = Array.from(container.querySelectorAll('.brand-letter-group'));
      groups.sort((a, b) => a.dataset.letter.localeCompare(b.dataset.letter));
      groups.forEach(g => container.appendChild(g));
    });

    initIsotope();
    resetSelections();

    document.body.classList.add('activated');
    const loader = document.getElementById('ProgressLoading');
    if (loader) loader.style.display = 'none';
  }

  // --- 4. Filtering & Isotope Management ---
  var $grid;
  var qsRegex = null;

  function initIsotope() {
    if ($grid && $grid.data('isotope')) {
      $grid.isotope('destroy');
    }

    $grid = $('.brand-box-container.active .brand-letter-group .list').isotope({
      itemSelector: 'li',
      layoutMode: 'fitRows',
      getSortData: {
        name: el => $(el).find('.name').text().toLowerCase()
      },
      sortBy: 'name',
      sortAscending: true,
      filter: function() {
        return qsRegex ? $(this).find('.name').text().match(qsRegex) : true;
      }
    });

    updateGroupCounters();
  }

  function escapeRegex(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function updateFilter() {
    const rawVal = $('.search').val().trim();
    if (rawVal) {
      const terms = rawVal.split(/\s*,\s*/).map(escapeRegex);
      qsRegex = new RegExp(terms.join('|'), 'gi');
    } else {
      qsRegex = null;
    }

    if ($grid) {
      $grid.isotope();
      setTimeout(updateGroupCounters, 120);
    }
  }

  function updateGroupCounters() {
    let totalVisible = 0;
    $('.brand-box-container.active .brand-letter-group').each(function() {
      const $group = $(this);
      const listInstance = $group.find('ul.list').data('isotope');
      const count = listInstance ? listInstance.filteredItems.length : $group.find('li:visible').length;

      $group.attr('data-count', count);
      if (count === 0) {
        $group.hide();
      } else {
        $group.show();
        totalVisible += count;
      }
    });

    if (totalVisible > 0) {
      $('.select-all-check').show();
    } else {
      $('.select-all-check').hide();
    }
  }

  function debounce(fn, wait = 100) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  // --- 5. Selection & ZIP Download Logic ---
  var links = [];

  function updateUIState() {
    const count = links.length;
    $('.brand-container .ry-flex .brand-text .count').text(count);

    if (count > 0) {
      $('.clear-all-check').show();
      $('.download.button-download').removeClass('disabled download-disable');
    } else {
      $('.clear-all-check').hide();
      $('.download.button-download').addClass('disabled download-disable');
    }
  }

  function resetSelections() {
    links = [];
    $('.brand-box-container input[type="checkbox"]').prop('checked', false);
    updateUIState();
  }

  $(function() {
    $('.search').on('input', debounce(updateFilter, 120));

    // Tab Navigation
    $('.button-wrapper .ry-btn-primary').on('click', function(e) {
      e.preventDefault();
      $('.button-wrapper .ry-btn-primary').removeClass('active');
      $(this).addClass('active');

      const targetSelector = $(this).data('target');
      $('.brand-box-container').removeClass('active animated-wait');
      $(targetSelector).addClass('active');

      resetSelections();
      $('.search').val('');
      qsRegex = null;
      initIsotope();
    });

    // Checkbox toggling
    $(document).on('change', '.brand-box-container input[type="checkbox"]', function() {
      const url = $(this).data('url');
      const val = $(this).val();

      if (this.checked) {
        if (!links.some(item => item.url === url)) {
          links.push({ url: url, value: val });
        }
      } else {
        links = links.filter(item => item.url !== url);
      }
      updateUIState();
    });

    // Select All Visible Items
    $('.select-all-check').on('click', function() {
      $('.brand-box-container.active .brand-letter-group:visible li:visible input[type="checkbox"]').each(function() {
        this.checked = true;
        const url = $(this).data('url');
        const val = $(this).val();
        if (!links.some(item => item.url === url)) {
          links.push({ url: url, value: val });
        }
      });
      updateUIState();
    });

    // Clear All
    $('.clear-all-check').on('click', function() {
      resetSelections();
    });

    // Sticky Filters
    $(window).on('scroll', function() {
      const isSticky = $(window).scrollTop() > 300;
      $('.brands .filter-group, .brand-container').toggleClass('fixed', isSticky);
    });
  });

  // --- 6. Reliable ZIP Generation ---
  async function generateZIP() {
    if (links.length === 0) return;

    const $btn = $('.download.button-download');
    const originalText = $btn.html();
    $btn.addClass('disabled').text(`Zipping (0/${links.length})...`);

    const zip = new JSZip();
    let processed = 0;

    const sanitizeFilename = (name, url) => {
      let ext = url.split('.').pop().split(/\#|\?/)[0];
      if (!ext || ext.length > 4) ext = 'png';
      const cleanName = name.replace(/[/\\?%*:|"<>]/g, '-').trim();
      return cleanName.toLowerCase().endsWith('.' + ext) ? cleanName : `${cleanName}.${ext}`;
    };

    try {
      const downloadTasks = links.map(async (item) => {
        try {
          const res = await fetch(item.url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          const fileName = sanitizeFilename(item.value, item.url);
          zip.file(fileName, blob);
        } catch (err) {
          console.warn(`Could not add ${item.value} to ZIP:`, err);
        } finally {
          processed++;
          $btn.text(`Zipping (${processed}/${links.length})...`);
        }
      });

      await Promise.all(downloadTasks);

      const content = await zip.generateAsync({
        type: 'blob',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      });

      saveAs(content, "Brand_Logos.zip");
    } catch (e) {
      console.error("ZIP Generation error:", e);
      alert("An error occurred while generating the ZIP. Please try again.");
    } finally {
      $btn.html(originalText).removeClass('disabled');
    }
  }

  // --- 7. Theme Switcher ---
  const themeToggle = document.querySelector(".theme-switch input");
  if (themeToggle) {
    const isSystemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const userTheme = localStorage.getItem('theme') || (isSystemDark ? 'dark' : 'light');

    document.documentElement.classList.add(userTheme);
    themeToggle.checked = (userTheme === 'dark');

    themeToggle.addEventListener("change", () => {
      const nextTheme = themeToggle.checked ? "dark" : "light";
      document.documentElement.classList.remove("light", "dark");
      document.documentElement.classList.add(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadAllImages();
  });
</script>
